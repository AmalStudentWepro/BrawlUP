<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrawlUp — Личный кабинет</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo" onclick="window.location.href='/index.html'">⚡ BrawlUp</div>
  <div class="nav-links">
    <a class="nav-link" onclick="window.location.href='/index.html'">Главная</a>
    <a class="nav-link" onclick="window.location.href='/index.html#offers'">Что мы предлагаем</a>
  </div>
  <button class="nav-btn">Личный кабинет</button>
</nav>

<div class="page">
  <canvas id="stars-canvas"></canvas>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="form-card">
    <div class="form-title">⚡ Личный кабинет</div>

    <div style="display:flex;gap:8px;margin-bottom:24px;">
      <button class="tab-btn active" id="tab-login">Войти</button>
      <button class="tab-btn" id="tab-register">Регистрация</button>
    </div>

    <div id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="Введите ваш email">
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="input-wrap">
          <input type="password" id="login-password" placeholder="Введите пароль">
          <button class="eye-btn" id="eye-login">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z" stroke="#f9c01b" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#f9c01b" stroke-width="2"/>
              <circle cx="12" cy="12" r="1.5" fill="#f9c01b"/>
              <line x1="3" y1="3" x2="21" y2="21" stroke="#f9c01b" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-btns">
        <button class="btn-login">Войти</button>
      </div>
    </div>

    <div id="form-register" style="display:none;">
      <div class="field">
        <label>Никнейм</label>
        <input type="text" id="nickname" placeholder="Введите никнейм">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="register-email" placeholder="Введите ваш email">
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="input-wrap">
          <input type="password" id="register-password" placeholder="Введите пароль">
          <button class="eye-btn" id="eye-register">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z" stroke="#f9c01b" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="#f9c01b" stroke-width="2"/>
              <circle cx="12" cy="12" r="1.5" fill="#f9c01b"/>
              <line x1="3" y1="3" x2="21" y2="21" stroke="#f9c01b" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-btns">
        <button class="btn-register">Зарегистрироваться</button>
      </div>
    </div>

    <a class="back-link" onclick="window.location.href='/index.html'">← Вернуться на главную</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
